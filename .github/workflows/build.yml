name: Build & Validate

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate & Build
        run: node scripts/build.mjs

      - name: Smoke test (契约检查 + 依赖可达性)
        # 探活失败不阻塞发布 (spider 契约不通才该 fail, 但那已经在 build 里 catch 过)
        # 只当"CI 提示"
        run: node --experimental-loader ./scripts/loader.mjs scripts/smoke.mjs --json=smoke.json || true

      - name: Sync tvbox.json + smoke.json 到 docs/ (给 GH Pages 展示)
        run: |
          mkdir -p docs
          cp -f tvbox.json docs/tvbox.json
          [ -f smoke.json ] && cp -f smoke.json docs/smoke.json || true

      - name: Commit tvbox.json if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # tvbox.json + docs 一起 add
          git add tvbox.json docs/tvbox.json docs/smoke.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: rebuild tvbox.json [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-config
          path: tvbox.json
          retention-days: 30
